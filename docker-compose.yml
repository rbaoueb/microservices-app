version: '3.8'

services:
  customer-service:
    build: ./customer-service
    container_name: customer-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8383:8383"
    networks:
      - spring-net
    depends_on:
      - zeebe
  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8082:8082"
    networks:
      - spring-net
  zeebe:
    image: camunda/zeebe:8.6.0
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8089:8080"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.998
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.999
      - ZEEBE_CLIENT_SECURITY_PLAINTEXT=true
      - ZEEBE_CLIENT_BROKER_GATEWAYADDRESS=zeebe:26500
      - ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT=2
      - "JAVA_TOOL_OPTIONS=-Xms1g -Xmx1g"
      # Ajouter la configuration REST API
      - ZEEBE_GATEWAY_REST_ENABLED=true
      - ZEEBE_GATEWAY_REST_HOST=0.0.0.0
    restart: always
    volumes:
      - zeebe:/usr/local/zeebe/data
    networks:
      - spring-net
    depends_on:
      elasticsearch:
        condition: service_healthy

  operate:
    image: camunda/operate:8.6.0
    container_name: operate
    ports:
      - "8094:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - spring-net
    depends_on:
      - zeebe
      - elasticsearch

  tasklist:
    image: camunda/tasklist:8.6.0
    container_name: tasklist
    ports:
      - "8093:8080"
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYSUPPRESSENVVARIABLES=true
      - CAMUNDA_TASKLIST_ZEEBE_USE_GRPC=true
      - CAMUNDA_TASKLIST_ZEEBE_REQUESTTIMEOUT=30s
      - CAMUNDA_TASKLIST_ZEEBE_RESTADDRESS=http://zeebe:8080  # ← AJOUTEZ CETTE LIGNE
    networks:
      - spring-net
    depends_on:
      - zeebe
      - elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cat/health | grep -q green" ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - spring-net

volumes:
  zeebe:
  elastic:

networks:
  spring-net: